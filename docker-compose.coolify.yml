# Coolify stack: web + worker + postgres + redis. NO caddy — Coolify's own
# proxy terminates HTTPS (real Let's Encrypt cert) and routes your domain to
# the web service on port 3000. NO env_file — set the environment variables in
# Coolify's UI; they are injected into every service here.
#
# Required env vars (Coolify → Environment Variables):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   DATABASE_URL=postgresql://<user>:<password>@postgres:5432/<db>
#   REDIS_URL=redis://redis:6379
#   TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET
#   BETTER_AUTH_SECRET            (openssl rand -base64 32)
#   BETTER_AUTH_URL=https://<your-domain>
#   PUBLIC_HOST=<your-domain>     (host only, no scheme)
#   OAUTH_REDIRECT_URL=https://<your-domain>/api/auth/callback/twitch
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in Coolify env}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vault}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    expose:
      - '3000'
    command: node .output/server/index.mjs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: node_modules/.bin/tsx worker/index.ts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
