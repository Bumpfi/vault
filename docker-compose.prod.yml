# Self-contained deployment for a home server or LAN, with Caddy in front.
# Twitch's OAuth only redirects to https (except for localhost), so Caddy
# serves the app over HTTPS using its own certificate authority. Variables
# come from .env; see .env.production.example.
x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-vault}
  REDIS_URL: redis://redis:6379
  TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:?}
  TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:?}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
  ALLOWED_TWITCH_USER_IDS: ${ALLOWED_TWITCH_USER_IDS:-}

services:
  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    ports:
      # Override when the host already uses these ports (e.g. unraid's UI).
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      SITE_ADDRESS: ${BETTER_AUTH_URL:?}
    volumes:
      - caddydata:/data # includes the generated root certificate
      - caddyconfig:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    build: .
    image: vault
    restart: unless-stopped
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: vault
    restart: unless-stopped
    command: ['node', '.output/jobs/worker.cjs']
    environment:
      <<: *app-env
    stop_grace_period: 30s # let a running poll finish on redeploy
    depends_on:
      # web applies the database migrations before it reports healthy.
      web:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vault}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
